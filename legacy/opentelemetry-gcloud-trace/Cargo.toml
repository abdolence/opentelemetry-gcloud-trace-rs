[package]
name = "opentelemetry-gcloud-trace"
version = "0.31.0"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Renamed to gcloud-observability; this crate re-exports it"
repository = "https://github.com/abdolence/gcloud-observability-rs"
documentation = "https://docs.rs/gcloud-observability"
readme = "README.md"
keywords = ["cloud-logging", "cloud-trace", "error-reporting", "opentelemetry", "tracing"]
categories = ["api-bindings", "development-tools::debugging"]

[badges]
maintenance = { status = "deprecated" }

[dependencies]
gcloud-observability = { version = "=0.31.0", path = "../..", default-features = false }

[features]
default = ["tls-roots", "logs", "auth-default-crypto"]
tls-roots = ["gcloud-observability/tls-roots"]
tls-webpki-roots = ["gcloud-observability/tls-webpki-roots"]
auth-default-crypto = ["gcloud-observability/auth-default-crypto"]
logs = ["gcloud-observability/logs"]
logs-api = ["gcloud-observability/logs-api"]
trace-api = ["gcloud-observability/trace-api"]
otlp = ["gcloud-observability/otlp"]
logs-otlp = ["gcloud-observability/logs-otlp"]
