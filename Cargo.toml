[package]
name = "opentelemetry-gcloud-trace"
version = "0.29.1"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Google Cloud Trace exporter for OpenTelemetry and a Google Cloud Logging layer for the tracing crate, with log entries correlated to traces"
homepage = "https://github.com/abdolence/opentelemetry-gcloud-trace-rs"
repository = "https://github.com/abdolence/opentelemetry-gcloud-trace-rs"
documentation = "https://docs.rs/opentelemetry-gcloud-trace"
keywords = ["tracing", "opentelemetry", "google-cloud", "cloud-logging", "cloud-trace"]
categories = ["api-bindings", "development-tools::debugging"]
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE", "SECURITY.md"]

[badges]
maintenance = { status = "actively-developed" }

[lib]
name = "opentelemetry_gcloud_trace"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
opentelemetry = { version = "0.33" }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-semantic-conventions = { version = "0.33" }
gcloud-sdk = { version = "0.33", features = ["google-devtools-cloudtrace-v2"], default-features = false }
rvstruct = "0.3"
rsb_derive = "0.5"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
serde_json = { version = "1", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
tokio = { version = "1", features = ["sync", "rt", "time"], optional = true }

[features]
default = ["tls-roots", "logs", "auth-default-crypto"]
tls-roots = ["gcloud-sdk/tls-roots"]
tls-webpki-roots = ["gcloud-sdk/tls-webpki-roots"]
# The rustls crypto provider google-cloud-auth signs service account keys with.
# Without it, or another provider installed by the application, building the
# exporter fails with `ErrorKind::CryptoProviderMissing`.
auth-default-crypto = ["gcloud-sdk/auth-default-crypto"]
logs = ["dep:tracing-subscriber", "dep:tracing-opentelemetry", "dep:serde_json", "dep:time"]
# `gcloud-sdk/google-logging-v2` already pulls in `google.logging.type` and
# `google.api`, which carry `LogSeverity`, `HttpRequest` and `MonitoredResource`.
logs-api = ["logs", "dep:tokio", "gcloud-sdk/google-logging-v2"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
opentelemetry = { version = "0.33" }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","registry"] }
tracing-opentelemetry = { version = "0.34" }
cargo-husky = { version = "1.5", default-features = false, features = ["run-for-all", "prepush-hook", "run-cargo-fmt"] }
rustls = "0.23"

[[example]]
name = "logging-only-api"
required-features = ["logs-api"]

[[example]]
name = "logging"
required-features = ["logs"]

[[example]]
name = "traces-and-logs"
required-features = ["logs-api"]
